naftiko: 1.0.0-alpha2
info:
  label: Chaos Mesh Dashboard API — Common
  description: 'Chaos Mesh Dashboard API — Common. 2 operations. Lead operation: Chaos Mesh List namespaces. Self-contained
    Naftiko capability covering one Chaos Mesh business surface.'
  tags:
  - Chaos Mesh
  - Common
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    CHAOS_MESH_API_KEY: CHAOS_MESH_API_KEY
capability:
  consumes:
  - type: http
    namespace: dashboard-common-2
    baseUri: http://{dashboardHost}:{dashboardPort}
    description: Chaos Mesh Dashboard API — Common business capability. Self-contained, no shared references.
    resources:
    - name: api-common-namespaces
      path: /api/common/namespaces
      operations:
      - name: listnamespaces
        method: GET
        description: Chaos Mesh List namespaces
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: api-common-pods
      path: /api/common/pods
      operations:
      - name: listpodsforselector
        method: POST
        description: Chaos Mesh List pods for a selector
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.CHAOS_MESH_API_KEY}}'
  exposes:
  - type: rest
    namespace: dashboard-common-2-rest
    port: 8080
    description: REST adapter for Chaos Mesh Dashboard API — Common. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api/common/namespaces
      name: api-common-namespaces
      description: REST surface for api-common-namespaces.
      operations:
      - method: GET
        name: listnamespaces
        description: Chaos Mesh List namespaces
        call: dashboard-common-2.listnamespaces
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/api/common/pods
      name: api-common-pods
      description: REST surface for api-common-pods.
      operations:
      - method: POST
        name: listpodsforselector
        description: Chaos Mesh List pods for a selector
        call: dashboard-common-2.listpodsforselector
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: dashboard-common-2-mcp
    port: 9090
    transport: http
    description: MCP adapter for Chaos Mesh Dashboard API — Common. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: chaos-mesh-list-namespaces
      description: Chaos Mesh List namespaces
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: dashboard-common-2.listnamespaces
      outputParameters:
      - type: object
        mapping: $.
    - name: chaos-mesh-list-pods-selector
      description: Chaos Mesh List pods for a selector
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: dashboard-common-2.listpodsforselector
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
