naftiko: 1.0.0-alpha2
info:
  label: Chaos Mesh Dashboard API
  description: The Chaos Mesh Dashboard API provides REST endpoints for managing chaos experiments, schedules, workflows,
    and events on Kubernetes clusters. Chaos Mesh is a cloud-native chaos engineering platform that supports fault injection
    into pods, nodes, networks, IO subsystems, and cloud provider resources. The Dashboard API is served by the chaos-dashboard
    component and is the backend for the Chaos Mesh web UI, accessible at /api on the dashboard server.
  tags:
  - Chaos
  - Mesh
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
